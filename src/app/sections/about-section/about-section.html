<div class="flex flex-col items-center gap-8">
  <app-personal-card></app-personal-card>

  <div class="flex flex-col">
    <h2>Bienvenue sur mon portfolio.</h2>
    <p>
      {{ personalInfo.bio }}
    </p>
  </div>

  <div class="flex items-center gap-3 rounded-xl bg-gray-100 px-5 py-1 text-sm shadow-lg w-fit">
    <img src="assets/skill_icons/toeic.svg" alt="TOEIC" class="w-16 h-16" />
    <span class="text-neutral-900 font-bold text-lg">{{ personalInfo.toeicScore }}</span>
    <a
      [href]="personalInfo.toeicLink"
      target="_blank"
      class="underline underline-offset-2 text-neutral-500 hover:text-orange-500 transition-colors"
    >
      Voir le certificat
    </a>
  </div>

  <app-icon-set></app-icon-set>

  <div class="flex flex-col gap-10">
    <h2>Un aperçu de mon parcours</h2>
    <app-timeline></app-timeline>
  </div>
</div>
