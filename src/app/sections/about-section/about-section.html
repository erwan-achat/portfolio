<div class="relative z-10 flex flex-col items-center gap-8">
  <app-personal-card></app-personal-card>

  <div class="flex flex-col">
    <h2>{{ languageService.ui().welcome }}</h2>
    <p>
      {{ personalInfo().bio }}
    </p>
  </div>

  <div class="flex w-fit items-center gap-3 rounded-xl bg-zinc-900 px-5 py-1 text-sm shadow-lg">
    <img src="assets/icons/toeic.svg" alt="TOEIC" class="h-16 w-16" />
    <span class="text-lg font-light text-accent-light">{{ personalInfo().toeicScore }}</span>
    <a
      [href]="personalInfo().toeicLink"
      target="_blank" rel="noopener noreferrer"
      class="text-white/70 underline underline-offset-2 transition-colors hover:text-accent-primary"
    >
      {{ languageService.ui().certificate }}
    </a>
  </div>

  <app-icon-set></app-icon-set>

  <div class="flex flex-col gap-10">
    <h2>{{ languageService.ui().journey }}</h2>
    <app-timeline></app-timeline>
  </div>
</div>
