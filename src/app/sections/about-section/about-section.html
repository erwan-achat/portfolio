<div class="flex flex-col items-center gap-8">
  <app-personal-card></app-personal-card>

  <div class="flex flex-col">
    <h2>{{ languageService.ui().welcome }}</h2>
    <p>
      {{ personalInfo().bio }}
    </p>
  </div>

  <div class="flex items-center gap-3 rounded-xl bg-zinc-900 px-5 py-1 text-sm shadow-lg w-fit">
    <img src="assets/icons/toeic.svg" alt="TOEIC" class="w-16 h-16" />
    <span class="font-light text-lg text-accent-light">{{ personalInfo().toeicScore }}</span>
    <a
      [href]="personalInfo().toeicLink"
      target="_blank" rel="noopener noreferrer"
      class="underline underline-offset-2 text-white/70 hover:text-accent-primary transition-colors"
    >
      {{ languageService.ui().certificate }}
    </a>
  </div>

  <app-icon-set></app-icon-set>

  <div class="flex flex-col gap-10">
    <h2>{{ languageService.ui().journey }}</h2>
    <app-timeline></app-timeline>
  </div>
</div>
