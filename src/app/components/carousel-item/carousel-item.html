<div class="experience-card">
  <div class="card-header">
    <h3 class="card-title">{{ item.title }}</h3>
    <p class="card-context">{{ item.context }}</p>
  </div>

  @if (item.image) {
    <img [src]="linkUrl(item.image)" alt="" loading="lazy" class="w-full rounded-sm" />
  }

  <div class="tech-stack">
    @for (skill of item.techStack; track skill.name) {
      <app-skill-icon [name]="skill.name" [image]="skill.image" [level]="skill.level" />
    }
  </div>

  <div class="card-section">
    <h4 class="card-label">Problématique</h4>
    <p class="card-text">{{ item.problem }}</p>
  </div>

  <div class="card-section">
    <h4 class="card-label">Solution</h4>
    <ul class="solution-list">
      @for (point of item.solution; track $index) {
        <li class="card-text">{{ point }}</li>
      }
    </ul>
  </div>

  @if (item.link) {
    <a [href]="linkUrl(item.link.url)" target="_blank" class="card-link">{{ item.link.label }}</a>
  }
</div>
