<div class="carousel bg-zinc-900">
  <button class="nav-btn nav-btn-left" (click)="prev()" aria-label="Précédent">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="carousel-track" [style.transform]="trackTransform()">
    @for (item of items; track $index) {
      <app-carousel-item class="carousel-slide" [item]="item" />
    }
  </div>

  <button class="nav-btn nav-btn-right" (click)="next()" aria-label="Suivant">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="carousel-indicators">
    @for (_ of items; track $index) {
      <button
        class="indicator-dot"
        [class.active]="$index === currentIndex()"
        (click)="goTo($index)"
      ></button>
    }
  </div>
</div>
