<div class="relative">
  <button
    type="button"
    class="group size-10 md:size-[3.5rem] rounded-full backdrop-blur-xl brightness-125 border border-white/20 flex items-center justify-center cursor-pointer translation-button focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white/80"
    id="language-trigger"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="listbox"
    aria-controls="language-menu"
    [attr.aria-label]="languageService.ui().languageMenuLabel"
    (click)="toggle()"
  >
    <img
      src="assets/icons/translation.svg"
      class="w-5 h-5 md:w-6 md:h-6 opacity-50 group-hover:opacity-90 transition-opacity duration-400 ease-in-out"
      alt=""
      aria-hidden="true"
    />
  </button>

  @if (isOpen) {
    <ul
      id="language-menu"
      class="language-dropdown"
      role="listbox"
      [attr.aria-label]="languageService.ui().languageMenuLabel"
    >
      @for (language of languageService.languages; track language.code) {
        <li class="py-0.5">
          <button
            type="button"
            role="option"
            [attr.aria-selected]="language.code === languageService.language()"
            [class.active]="language.code === languageService.language()"
            (click)="selectLanguage(language.code)"
          >
            {{ language.nativeName }}
          </button>
        </li>
      }
    </ul>
  }
</div>
